<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBook - Movie Ticket Booking</title>
    <meta name="description" content="Interactive movie ticket booking platform featuring real-time seat reservation, cinema showtimes, language filters, and instant printable tickets." />
    <meta property="og:title" content="CineBook - Movie Ticket Booking" />
    <meta property="og:description" content="Interactive movie ticket booking platform featuring real-time seat reservation, cinema showtimes, language filters, and instant printable tickets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      h1, h2, h3, .font-display {
        font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-ticket, #printable-ticket * {
          visibility: visible;
        }
        #printable-ticket {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          background: white !important;
          color: black !important;
          box-shadow: none !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500 selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
